{{- $app := .Values.spotweb -}}
{{- if $app.enabled }}
{{- $db := $app.database }}
{{- $bridge := $app.bridge }}
{{- if $bridge.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spotweb-bridge
  namespace: {{ .Release.Namespace }}
  {{- include "media.labels" (dict "own" (dict "app" "spotweb") "app" $app) | nindent 2 }}
data:
  {{- toYaml (dict "spotweb-bridge.py" (.Files.Get "files/spotweb-bridge.py")) | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: spotweb
  namespace: {{ .Release.Namespace }}
  {{- include "media.labels" (dict "own" (dict "app" "spotweb") "app" $app) | nindent 2 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
    {{- if $bridge.enabled }}
    - name: bridge
      port: {{ $bridge.port }}
      targetPort: {{ $bridge.port }}
    {{- end }}
  selector:
    app: spotweb
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotweb
  namespace: {{ .Release.Namespace }}
  {{- include "media.labels" (dict "own" (dict "app" "spotweb") "app" $app) | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotweb
  template:
    metadata:
      {{- include "media.podLabels" (dict "name" "spotweb" "app" $app) | nindent 6 }}
    spec:
      containers:
        - env:
            {{- include "media.tzEnv" (dict "root" . "app" $app) | nindent 12 }}
            - name: SPOTWEB_DB_TYPE
              value: {{ $db.type | quote }}
            - name: SPOTWEB_DB_HOST
              value: {{ required "spotweb.database.host is required" $db.host | quote }}
            - name: SPOTWEB_DB_PORT
              value: {{ $db.port | quote }}
            - name: SPOTWEB_DB_NAME
              value: {{ $db.name | quote }}
            - name: SPOTWEB_DB_USER
              value: {{ $db.user | quote }}
            {{- with $db.existingSecret }}
            - name: SPOTWEB_DB_PASS
              valueFrom:
                secretKeyRef:
                  key: {{ $db.passwordKey }}
                  name: {{ . }}
            {{- end }}
            {{- with $app.cron.retrieve }}
            - name: SPOTWEB_CRON_RETRIEVE
              value: {{ . | quote }}
            {{- end }}
            {{- with $app.cron.cacheCheck }}
            - name: SPOTWEB_CRON_CACHE_CHECK
              value: {{ . | quote }}
            {{- end }}
          image: {{ $app.image }}
          {{- with $app.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          name: spotweb
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            periodSeconds: 10
            tcpSocket:
              port: http
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /config
              name: config
        {{- if $bridge.enabled }}
        - command:
            - python3
            - /app/spotweb-bridge.py
          env:
            - name: PORT
              value: {{ $bridge.port | quote }}
            - name: SPOTWEB_URL
              value: http://127.0.0.1:80
            - name: SPOTWEB_HOST
              value: spotweb.{{ .Release.Namespace }}.svc.cluster.local
            {{- with $bridge.radarr.url }}
            - name: RADARR_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $bridge.radarr.existingSecret }}
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: {{ $bridge.radarr.apiKeyKey }}
                  name: {{ . }}
            {{- end }}
          image: {{ $bridge.image }}
          name: bridge
          ports:
            - containerPort: {{ $bridge.port }}
              name: bridge
          readinessProbe:
            httpGet:
              path: /healthz
              port: bridge
            periodSeconds: 10
          resources:
            {{- toYaml $bridge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app
              name: bridge
              readOnly: true
        {{- end }}
      {{- include "media.placement" $app | nindent 6 }}
      volumes:
        # The entrypoint rewrites /config from the environment on every start.
        - emptyDir: {}
          name: config
        {{- if $bridge.enabled }}
        - configMap:
            name: spotweb-bridge
          name: bridge
        {{- end }}
{{ include "media.ingresses" (dict "root" . "app" $app "service" "spotweb" "port" 80) }}
{{- end }}
