  claimToken: ""
  hostNetwork: true
  resources:
    requests:
      cpu: 20m
      memory: 448Mi
    limits:
      memory: 3Gi
  persistence:
    claimName: plex
    size: 50Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    source: {}
  ingresses: []

prowlarr:
  enabled: false
  image: linuxserver/prowlarr:2.7.0
  imagePullPolicy: IfNotPresent
  strategy:
    type: Recreate
  # Secret with the Postgres password, exposed as PROWLARR__POSTGRES__PASSWORD.
  postgres:
    existingSecret: ""
    passwordKey: password
  # ConfigMap holding a config.xml to seed /config with. Empty: the app writes its own.
  seedConfigMap: ""
  exportarr:
    enabled: false
  podMonitor:
    enabled: false
  resources:
    requests:
      cpu: 11m
      memory: 100Mi
    limits:
      memory: 512Mi
  persistence:
    claimName: prowlarr-data
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    source: {}
  ingresses: []

qbittorrent:
