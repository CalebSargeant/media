# Every app is off until `enabled: true`. Besides its own keys, each accepts
# whichever of these apply to it:
#   image          full image reference
#   labels         added to every object the app renders
#   podLabels      added to the pod template, beside `app: <name>`
#   nodeSelector   \
#   affinity        > pod placement
#   tolerations    /
#   timezone       overrides the top-level timezone
#   resources      main container resources
#   ingresses      Ingress objects, each:
#                    name: radarr                  # object name
#                    annotations: {}
#                    labels: {}
#                    rules:
#                      - host: radarr.example.com  # backend defaults to the app's Service
#                        service: other            # optional backend overrides
#                        port: 8080
#                    tls:
#                      - hosts: [radarr.example.com]
#                        secretName: radarr-tls
#
# A `persistence` block renders a PVC named `claimName`, plus a static PV of the
# same name when `source` holds a volume source (hostPath, nfs, ...). Every PV and
# PVC carries helm.sh/resource-policy: keep, so an uninstall never deletes data.

puid: "1000"
pgid: "1000"
timezone: Etc/UTC

# Volumes several apps mount: movies, series, music and downloads. The apps
# expect these claims to exist, so enable this unless they come from elsewhere.
library:
  enabled: false
  labels: {}
  volumes:
    movies:
      size: 1Ti
      accessMode: ReadWriteOnce
      storageClass: ""
      source: {}
    series:
      size: 1Ti
      accessMode: ReadWriteOnce
      storageClass: ""
      source: {}
    music:
      size: 500Gi
      accessMode: ReadWriteOnce
      storageClass: ""
      source: {}
    downloads:
      size: 500Gi
      accessMode: ReadWriteOnce
      storageClass: ""
      source: {}

# Metrics sidecar for radarr, sonarr and prowlarr. Needs the app's seedConfigMap,
# which is where it reads the API key from.
exportarr:
  image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
  resources:
    requests:
      cpu: 5m
      memory: 24Mi
    limits:
      memory: 96Mi

# Init container that copies config.xml from an app's seedConfigMap into its
# config volume on every start.
seedConfig:
  image: busybox:1.37.0
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      memory: 32Mi

bazarr:
  enabled: false
  image: linuxserver/bazarr:1.6.2
  resources:
    requests:
      cpu: 10m
      memory: 238Mi
    limits:
      memory: 512Mi
  persistence:
    claimName: bazarr
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    source: {}
  ingresses: []

flaresolverr:
  enabled: false
  image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
