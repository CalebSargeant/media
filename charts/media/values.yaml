      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    claimName: qbittorrent
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    source: {}
  ingresses: []

radarr:
  enabled: false
  image: linuxserver/radarr:6.4.4
  postgres:
    existingSecret: ""
    passwordKey: password
  seedConfigMap: ""
