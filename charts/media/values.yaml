  # recyclarr.yml. API keys are read with `!env_var SONARR_API_KEY` / `!env_var RADARR_API_KEY`.
  config: ""
  # Secret with SONARR_API_KEY and RADARR_API_KEY.
  existingSecret: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

sabnzbd:
  enabled: false
  image: linuxserver/sabnzbd:4.5.5
  resources:
    requests:
      cpu: 200m
      ephemeral-storage: 1Gi
      memory: 256Mi
    limits:
      cpu: 750m
      ephemeral-storage: 4Gi
      memory: 512Mi
  persistence:
    claimName: sabnzbd-config
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    source: {}
  ingresses: []

sonarr:
  enabled: false
  image: linuxserver/sonarr:4.0.20
  postgres:
    existingSecret: ""
    passwordKey: password
  seedConfigMap: ""
  exportarr:
    enabled: false
  podMonitor:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 320Mi
    limits:
      memory: 512Mi
  persistence:
    claimName: sonarr
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    source: {}
  ingresses: []

# Unmonitors and deletes titles that are on a subscribed streaming service, and
# re-adds them once they leave it. See files/sync.py.
streamingSync:
  enabled: false
  image: python:3.12.16-slim
  schedule: "0 5 * * *"
  # Secret with TMDB_API_KEY, RADARR_API_KEY, SONARR_API_KEY and, optionally, SLACK_BOT_TOKEN.
  existingSecret: ""
  # Each setting below is a string and becomes an env var when non-empty; empty
  # ones use the script's default.
  dryRun: "true"
  region: ""
  providers: ""
  keepTag: ""
  maxRemove: ""
  slackChannel: ""
  # Defaults to the radarr and sonarr Services in the `media` namespace.
  radarrUrl: ""
  sonarrUrl: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
