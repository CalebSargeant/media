name: Chart release

# Publishes charts/media as an OCI artifact to ghcr.io/<owner>/charts/media at
# the release's version. No chart repository or index.yaml to maintain.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version to publish (defaults to the ref name minus its leading v)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: chart-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          # Helm rejects a leading v in a chart version.
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing chart version ${version}"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "${REGISTRY_TOKEN}" | helm registry login ghcr.io --username "${REGISTRY_USER}" --password-stdin

      - name: Package and push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Registry paths must be lower case; GitHub owner names need not be.
          repo="oci://ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/charts"
          helm package charts/media --version "${VERSION}" --destination dist
          helm push "dist/media-${VERSION}.tgz" "${repo}"

      - name: Log out
        if: always()
        run: helm registry logout ghcr.io || true
